name: CI
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const fs=require("node:fs"); const report=JSON.parse(fs.readFileSync("/tmp/npm-audit.json","utf8")); const vulns=Object.entries(report.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range})})); console.log(JSON.stringify({metadata:report.metadata?.vulnerabilities,vulnerabilities:vulns},null,2));'
      - run: npm run lint:types
      - run: npm test
      - run: npm run build
